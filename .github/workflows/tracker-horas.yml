name: tracker-horas

on:
  push:
    branches: [main]
    paths:
      - "tracker-horas/**"
      - ".github/workflows/tracker-horas.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracker-horas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || {
            # Publica los errores como anotaciones (se ven sin iniciar sesión)
            grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Preparar archivo
        run: cp app/build/outputs/apk/release/app-release.apk ../tracker-horas.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tracker-horas-v1.0.${{ github.run_number }}
          name: Tracker de horas v1.0.${{ github.run_number }}
          body: |
            Descarga `tracker-horas.apk` desde el celular y ábrelo para instalar.
            Enlace fijo a la última versión:
            https://github.com/${{ github.repository }}/releases/latest/download/tracker-horas.apk
          files: tracker-horas.apk
          make_latest: true
